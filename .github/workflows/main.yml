name: Build rtdump-il2cpp-ps5

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk

jobs:
  build:
    name: Build ELF payload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PS5 payload SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget \
            unzip \
            clang-18 \
            lld-18 \
            cmake \
            ninja-build

          wget -q \
            https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip \
            -O /tmp/ps5-payload-sdk.zip

          sudo unzip -q /tmp/ps5-payload-sdk.zip -d /opt

          echo "SDK contents:"
          ls -la "$PS5_PAYLOAD_SDK"

          echo "Checking Makefile.inc:"
          test -f "$PS5_PAYLOAD_SDK/Makefile.inc"

          echo "Makefile.inc found."

      - name: Build libcxx
        run: |
          wget -q \
            https://raw.githubusercontent.com/ps5-payload-dev/sdk/master/libcxx.sh \
            -O /tmp/libcxx.sh

          chmod +x /tmp/libcxx.sh

          sudo -E \
            PS5_PAYLOAD_SDK="$PS5_PAYLOAD_SDK" \
            /tmp/libcxx.sh

      - name: Build rtdump-il2cpp-ps5
        env:
          PS5_PAYLOAD_SDK: /opt/ps5-payload-sdk
        run: |
          make -j$(nproc)

      - name: Verify ELF
        run: |
          file rtdump-il2cpp-ps5.elf
          ls -lh rtdump-il2cpp-ps5.elf

      - name: Upload ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtdump-il2cpp-ps5-${{ github.sha }}
          path: rtdump-il2cpp-ps5.elf
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rtdump-il2cpp-ps5.elf
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
